<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Work — Titodevsec</title>
  <meta name="description" content="Selected work by Tito Oscar Mwaisengela (Titodevsec): full-stack development and cybersecurity projects." />
  <meta property="og:title" content="Work — Titodevsec" />
  <meta property="og:description" content="Selected work by Tito Oscar Mwaisengela: full-stack development and cybersecurity projects." />
  <meta property="og:image" content="https://titodevsec.online/images/profile.jpeg" />
  <meta property="og:url" content="https://titodevsec.online/work" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://titodevsec.online/work" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23455ce9'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='34' fill='white'%3ET%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<noscript><style>.preloader,.transition{display:none!important}</style></noscript>

<!-- ═══ Preloader ═══ -->
<div id="preloader" class="preloader" aria-hidden="true">
  <p class="preloader__word"><span class="preloader__dot"></span><span id="preloader-text"></span></p>
  <svg class="preloader__curve" aria-hidden="true"><path id="preloader-path" d=""/></svg>
</div>

<!-- ═══ Page transition curtain ═══ -->
<div id="transition" class="transition" aria-hidden="true">
  <svg class="transition__svg" aria-hidden="true"><path id="transition-path" d=""/></svg>
  <p class="transition__label"><span class="preloader__dot"></span><span id="transition-text"></span></p>
</div>

<!-- ═══ Header ═══ -->
<header id="header" class="header" data-theme="dark">
  <a class="logo magnetic" href="/" aria-label="Titodevsec — home">
    <span class="logo__copy">©</span>
    <span class="logo__code">Code by</span>
    <span class="logo__name"><span class="logo__first">Tito</span><span class="logo__last">Mwaisengela</span></span>
  </a>
  <nav class="nav" aria-label="Primary">
    <a class="nav__link magnetic" href="/work" data-ns="work">Work</a>
    <a class="nav__link magnetic" href="/about" data-ns="about">About</a>
    <a class="nav__link magnetic" href="/contact" data-ns="contact">Contact</a>
  </nav>
</header>

<!-- ═══ Floating menu button ═══ -->
<button id="nav-btn" class="nav-btn magnetic" type="button" aria-label="Open menu" aria-expanded="false"><span class="burger magnetic__inner"></span></button>

<!-- ═══ Slide-in menu ═══ -->
<div id="panel-backdrop" class="panel-backdrop"></div>
<aside id="panel" class="panel" aria-hidden="true">
  <svg class="panel__curve" aria-hidden="true"><path id="panel-path" d=""/></svg>
  <div class="panel__inner">
    <div>
      <p class="panel__label">Navigation</p>
      <nav class="panel__nav" aria-label="Menu">
        <a class="panel__link" href="/" data-ns="home">Home</a>
        <a class="panel__link" href="/work" data-ns="work">Work</a>
        <a class="panel__link" href="/about" data-ns="about">About</a>
        <a class="panel__link" href="/contact" data-ns="contact">Contact</a>
      </nav>
    </div>
    <div class="panel__footer">
      <p class="panel__label panel__label--plain">Socials</p>
      <div class="panel__socials" data-socials></div>
    </div>
  </div>
</aside>

<!-- ═══ Project hover preview ═══ -->
<div id="modal" class="modal" aria-hidden="true"><div id="modal-slider" class="modal__slider"></div></div>
<div id="modal-cursor" class="modal__cursor" aria-hidden="true"></div>
<div id="modal-label" class="modal__label" aria-hidden="true">View</div>

<div data-barba="wrapper">
  <main data-barba="container" data-barba-namespace="work" data-header="dark" class="page page--work">

    <section class="work-head">
      <h1 class="h1" data-reveal="words">Building secure, scalable digital products</h1>
      <div class="work-tools">
        <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
        <div class="views" role="group" aria-label="View">
          <button class="view-btn magnetic is-active" type="button" data-view="list" aria-label="List view">
            <svg class="magnetic__inner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            <span class="btn__fill"></span>
          </button>
          <button class="view-btn magnetic" type="button" data-view="grid" aria-label="Grid view">
            <svg class="magnetic__inner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
            <span class="btn__fill"></span>
          </button>
        </div>
      </div>
    </section>

    <section class="work-body">
      <div class="work-table" id="work-list">
        <div class="work-table__head"><span>Project</span><span>Location</span><span>Services</span><span>Year</span></div>
        <div class="work-table__rows" id="work-rows"></div>
      </div>
      <div class="work-grid" id="work-grid" hidden></div>
    </section>

    <div data-contact-cta data-curve="#ffffff"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
